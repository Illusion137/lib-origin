name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'yarn'
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            yarn install --frozen-lockfile --network-concurrency 1 && exit 0
            echo "yarn install failed (attempt $attempt), retrying"
          done
          exit 1
      - run: yarn lint
      - run: yarn build:osx
      - run: yarn test:ci